services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Backend/Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tcc;Username=postgres;Password=postgres"
      Redis__Configuration: "redis:6379"
      Mqtt__Broker: "mosquitto"
      Mqtt__ExternalBrokerHost: "host.docker.internal"
      Mqtt__Port: "1883"
      MockRuntime__Enabled: "true"
      MockRuntime__ExecutablePath: "/app/mock-runtime/pc_telemetry_runner"
      MockRuntime__BrokerUri: "tcp://mosquitto:1883"
    ports:
      - "8080:8080"
    restart: on-failure

  consumer:
    build:
      context: .
      dockerfile: Consumer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tcc;Username=postgres;Password=postgres"
      Redis__Configuration: "redis:6379"
      Mqtt__Broker: "mosquitto"
      Mqtt__Port: "1883"
    restart: on-failure

volumes:
  postgres_data:
    name: tcc_postgres_data
  redis_data:
